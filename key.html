<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player - Shaka Compat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.7/shaka-player.compiled.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    #err {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(120, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      direction: ltr;
      display: none;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>
  <div id="err"></div>

  <script>
    const DEFAULT_MPD = "https://mbc-aws-ksa.mncdn.com/vod/aws/3060004241-STXML/cbd84042023a437fbd6d18dd093402ec/7c201da305b543e0ae55a3673f9aa3a5/840aa317c6f34c8fb0ef18117f07c496/index.mpd";
    const DEFAULT_KEYS = "990663bead8f4e4cb63e724703af8d44:145a0823f144005555106ba54d89fd16";

    function showErr(msg) {
      const el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = msg;
    }

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,\s]+/).forEach(entry => {
        const [kid, key] = entry.split(":");
        if (kid && key) {
          map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
        }
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      const params = new URLSearchParams(window.location.search);
      const mpd = (params.get("mpd") || DEFAULT_MPD).trim();
      const keys = parseKeys((params.get("keys") || DEFAULT_KEYS).trim());

      const video = document.getElementById("video");
      const player = new shaka.Player(video);

      player.configure({
        drm: {
          clearKeys: keys,
          advanced: {
            "org.w3.clearkey": {
              videoRobustness: "",
              audioRobustness: ""
            }
          }
        },
        manifest: {
          dash: {
            ignoreMinBufferTime: true,
            autoCorrectDrift: true
          }
        },
        streaming: {
          bufferingGoal: 20,
          rebufferingGoal: 2,
          retryParameters: {
            timeout: 15000,
            maxAttempts: 5,
            baseDelay: 800,
            backoffFactor: 1.5,
            fuzzFactor: 0.5
          }
        }
      });

      player.addEventListener("error", (e) => {
        const d = e.detail || {};
        showErr(`Shaka Error ${d.code || ""} (Cat ${d.category || ""}): ${d.message || ""}`);
      });

      try {
        await player.load(mpd);
        await video.play();
      } catch (err) {
        showErr(`Load Error: ${err.code || ""} ${err.message || err}`);
      }
    });
  </script>
</body>
</html>
