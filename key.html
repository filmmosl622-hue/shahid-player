<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <video id="video" controls autoplay playsinline></video>

  <script>
    const DEFAULT_MPD = "https://orng.shahid.net/out/v1/c0dec4a696d941ad99e43fcb4ba96951/226eaf4a243f4bfb9ebb0bec3ac58d43/f93a7f08a52a4bab90cd98ed665b3f52/index.mpd?";
    const DEFAULT_KEYS = "--key 3624ff9e22f549cc85507348e7dd9ab4:6fa156a188731c2e214172ac635d88ec";

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,]+/).forEach(line => {
        const clean = line.trim();
        if (clean.includes(":")) {
          const [kid, key] = clean.split(":");
          if (kid && key) {
            map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
          }
        }
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      const params = new URLSearchParams(window.location.search);
      const mpdUrl = (params.get("mpd") || DEFAULT_MPD).trim();
      const keysRaw = (params.get("keys") || DEFAULT_KEYS).trim();

      const video = document.getElementById("video");
      const player = new shaka.Player();
      await player.attach(video);

      const clearKeys = parseKeys(keysRaw);
      if (Object.keys(clearKeys).length > 0) {
        player.configure({
          drm: { clearKeys }
        });
      }

      try {
        await player.load(mpdUrl);
        video.play().catch(() => {});
      } catch (e) {
        console.error("Playback error:", e);
      }
    });
  </script>
</body>
</html>
