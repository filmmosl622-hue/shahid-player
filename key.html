<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player - dash.js</title>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>

  <script>
    const DEFAULT_MPD = "https://mbc-aws-ksa.mncdn.com/vod/aws/3060004241-STXML/cbd84042023a437fbd6d18dd093402ec/7c201da305b543e0ae55a3673f9aa3a5/840aa317c6f34c8fb0ef18117f07c496/index.mpd";
    const DEFAULT_KEYS = "990663bead8f4e4cb63e724703af8d44:145a0823f144005555106ba54d89fd16";

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,\s]+/).forEach(part => {
        const [kid, key] = part.trim().split(":");
        if (kid && key) map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const url = (params.get("mpd") || DEFAULT_MPD).trim();
      const keys = parseKeys((params.get("keys") || DEFAULT_KEYS).trim());

      const video = document.getElementById("video");
      const player = dashjs.MediaPlayer().create();

      if (Object.keys(keys).length > 0) {
        player.setProtectionData({
          "org.w3.clearkey": { clearkeys: keys }
        });
      }

      player.initialize(video, url, true);
    });
  </script>
</body>
</html>
