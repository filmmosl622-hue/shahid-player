<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <video id="video" controls autoplay playsinline></video>

  <script>
    const DEFAULT_MPD = "https://orng.shahid.net/vod/aws/3060004200-STXMLOPEN4K/6ca421d0be254f67a6ded15c566d5dc6/7c201da305b543e0ae55a3673f9aa3a5/840aa317c6f34c8fb0ef18117f07c496/index.mpd";
    const DEFAULT_KEYS = "a48b582e2c0a46f7930a2e3e1bd0ba3c:53c832ebae2d40298dbd3ca609428c73";

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,]+/).forEach(line => {
        const clean = line.trim();
        if (clean.includes(":")) {
          const [kid, key] = clean.split(":");
          if (kid && key) {
            map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
          }
        }
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      const params = new URLSearchParams(window.location.search);
      const mpdUrl = (params.get("mpd") || DEFAULT_MPD).trim();
      const keysRaw = (params.get("keys") || DEFAULT_KEYS).trim();

      const video = document.getElementById("video");
      const player = new shaka.Player();
      await player.attach(video);

      const clearKeys = parseKeys(keysRaw);
      if (Object.keys(clearKeys).length > 0) {
        player.configure({
          drm: { clearKeys }
        });
      }

      try {
        await player.load(mpdUrl);
        video.play().catch(() => {});
      } catch (e) {
        console.error("Playback error:", e);
      }
    });
  </script>
</body>
</html>
