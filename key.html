<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player - dash.js ClearKey</title>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    #err {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(120, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      direction: ltr;
      display: none;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>
  <div id="err"></div>

  <script>
    const DEFAULT_MPD = "https://mbc-aws-ksa.mncdn.com/vod/aws/3060004241-STXML/cbd84042023a437fbd6d18dd093402ec/7c201da305b543e0ae55a3673f9aa3a5/840aa317c6f34c8fb0ef18117f07c496/index.mpd";
    const DEFAULT_KEYS = "990663bead8f4e4cb63e724703af8d44:145a0823f144005555106ba54d89fd16";

    function showErr(msg) {
      const el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = msg;
    }

    function parseKeysMap(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,\s]+/).forEach(item => {
        const parts = item.trim().split(":");
        if (parts.length === 2 && parts[0] && parts[1]) {
          map[parts[0].trim().toLowerCase()] = parts[1].trim().toLowerCase();
        }
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const url = (params.get("mpd") || DEFAULT_MPD).trim();
      const keysRaw = (params.get("keys") || DEFAULT_KEYS).trim();
      const clearKeys = parseKeysMap(keysRaw);

      const video = document.getElementById("video");
      const player = dashjs.MediaPlayer().create();

      player.updateSettings({
        streaming: {
          retryAttempts: { MPD: 4, MediaSegment: 4 },
          retryInterval: 1000
        }
      });

      if (Object.keys(clearKeys).length > 0) {
        player.setProtectionData({
          "org.w3.clearkey": {
            clearkeys: clearKeys
          }
        });
      }

      player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
        showErr("dash.js Error: " + JSON.stringify(e.error || e));
      });

      player.initialize(video, url, true);
    });
  </script>
</body>
</html>
