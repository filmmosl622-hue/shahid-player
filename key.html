<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <video id="video" controls autoplay playsinline webkit-playsinline preload="auto"></video>

  <script>
    const DEFAULT_MPD = "https://mbc-aws-ksa.mncdn.com/vod/aws/3060004241-STXML/cbd84042023a437fbd6d18dd093402ec/7c201da305b543e0ae55a3673f9aa3a5/840aa317c6f34c8fb0ef18117f07c496/index.mpd?";
    const DEFAULT_KEYS = "990663bead8f4e4cb63e724703af8d44:145a0823f144005555106ba54d89fd16";

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,]+/).forEach(line => {
        const clean = line.trim();
        if (clean.includes(":")) {
          const [kid, key] = clean.split(":");
          if (kid && key) {
            map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
          }
        }
      });
      return map;
    }

    async function forceAutoPlay(video) {
      try {
        await video.play();
        return;
      } catch (e) {
        // المتصفحات الموبايل غالباً تسمح بالتشغيل التلقائي عند كتم الصوت أولاً
        video.muted = true;
        try {
          await video.play();
        } catch (err) {
          console.warn("Autoplay blocked until user tap:", err);
        }
      }
    }

    async function nativeFallback(video, url) {
      try {
        video.src = url;
        video.load();
        await forceAutoPlay(video);
      } catch (err) {
        console.error("Native fallback failed:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const mpdUrl = (params.get("mpd") || DEFAULT_MPD).trim();
      const keysRaw = (params.get("keys") || DEFAULT_KEYS).trim();
      const video = document.getElementById("video");

      // في حال لم يكن الرابط MPD (مثلاً MP4 مباشر) استخدم المشغل الأصلي مباشرة
      if (!/\.mpd(\?|#|$)/i.test(mpdUrl)) {
        await nativeFallback(video, mpdUrl);
        return;
      }

      if (typeof shaka !== "undefined") {
        shaka.polyfill.installAll();
      }

      if (typeof shaka === "undefined" || !shaka.Player.isBrowserSupported()) {
        await nativeFallback(video, mpdUrl);
        return;
      }

      const player = new shaka.Player();

      try {
        await player.attach(video);

        player.configure({
          streaming: {
            bufferingGoal: 15,
            rebufferingGoal: 2
          }
        });

        const clearKeys = parseKeys(keysRaw);
        if (Object.keys(clearKeys).length > 0) {
          player.configure({
            drm: { clearKeys }
          });
        }

        player.addEventListener("error", (event) => {
          console.error("Shaka error:", event.detail);
        });

        await player.load(mpdUrl);
        await forceAutoPlay(video);
      } catch (e) {
        console.error("Shaka load failed, trying native fallback:", e);
        await nativeFallback(video, mpdUrl);
      }
    });
  </script>
</body>
</html>
