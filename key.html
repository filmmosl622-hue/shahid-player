<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.2/shaka-player.compiled.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <video id="video" controls autoplay playsinline></video>

  <script>
    const DEFAULT_MPD = "https://playlists.play.yango.tech/vod/vh-ottmn-converted/vod-content/f0b39b5d0dc04f35a2c20112f3eeca00/MWx1795010897x6094062889886833286xdfc07b3d-21e4-3927-befa-3e5311e0c34f/kaltura/dash_drm_sdr_hd_avc_aac_b98956bb4f840f9cfe642fdbdf79d649/x/ysign1=e44ec7ff36488a164475bb2941d408c54221341a1c9fd3bf2de543624fe095ac,abcID=45119,bstrat=mena_v1_strat,from=yango-movies-web,pfx,prpo=900,sfx,ts=6b036d07/manifest.mpd?ottsessionid=cae93a41ddb7482a88984b39de5aba9b&vsid=e0a426ef4a3cf2c5137977ba767381bd7323b77f921exFLMx6690x1795213830&vpuid=7py5dx8ndr&source_index=1&mburl=1&subs=1&deranged=1&force_protection=wv&t=1795213831359#t=0";
    const DEFAULT_KEYS = "05329e8817c48f34ebb24e24dcd10003:cca186285d52f718685d25d4154e672a";

    function parseKeys(raw) {
      const map = {};
      if (!raw) return map;
      raw.split(/[\r\n,]+/).forEach(line => {
        const clean = line.trim();
        if (clean.includes(":")) {
          const [kid, key] = clean.split(":");
          if (kid && key) {
            map[kid.trim().toLowerCase()] = key.trim().toLowerCase();
          }
        }
      });
      return map;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      shaka.polyfill.installAll();

      const params = new URLSearchParams(window.location.search);
      const mpdUrl = (params.get("mpd") || DEFAULT_MPD).trim();
      const keysRaw = (params.get("keys") || DEFAULT_KEYS).trim();

      const video = document.getElementById("video");
      const player = new shaka.Player();
      await player.attach(video);

      const clearKeys = parseKeys(keysRaw);
      if (Object.keys(clearKeys).length > 0) {
        player.configure({
          drm: { clearKeys }
        });
      }

      try {
        await player.load(mpdUrl);
        video.play().catch(() => {});
      } catch (e) {
        console.error("Playback error:", e);
      }
    });
  </script>
</body>
</html>
