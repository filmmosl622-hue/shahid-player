<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغّل DASH — الجواهرجي</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
  <style>
    :root {
      --bg: #0c0d10;
      --panel: #151821;
      --gold: #ffcc00;
      --cyan: #00f2ff;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      width: 100%;
      max-width: 920px;
      background: var(--panel);
      border: 1px solid rgba(0, 242, 255, 0.18);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      color: var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 242, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(0, 242, 255, 0.3);
    }

    video {
      width: 100%;
      max-height: 520px;
      background: #000;
      border-radius: 14px;
      display: block;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-play { background: var(--gold); color: #000; }
    .btn-clip { background: var(--cyan); color: #000; }
    .btn-stop { background: #272b38; color: #fff; }

    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <h1>
      <span>مشغّل DASH — الجواهرجي</span>
      <span class="badge" id="timerBadge">وضع البث المفتوح</span>
    </h1>

    <video id="video" controls autoplay playsinline></video>

    <div class="btns">
      <button class="btn-play" onclick="loadCurrent(false)">إعادة تحميل / تشغيل ▶</button>
      <button class="btn-clip" onclick="loadCurrent(true)">بث لمدة دقيقتين ⏱️</button>
      <button class="btn-stop" onclick="stopStream()">إيقاف ⏹</button>
    </div>

    <div class="status" id="status">جاري تحميل البث...</div>
  </div>

  <script>
    const DEFAULT_MPD = "https://playlists.play.yango.tech/vod/vh-ottmn-converted/vod-content/f0b39b5d0dc04f35a2c20112f3eeca00/MWx1795010897x6094062889886833286xdfc07b3d-21e4-3927-befa-3e5311e0c34f/kaltura/dash_drm_sdr_hd_avc_aac_b98956bb4f840f9cfe642fdbdf79d649/x/ysign1=81a71f9e146d5dadc35cdc38353687f67fbc31b5c78aa052ca4ca9c52e7f5c52,abcID=45119,bstrat=mena_v1_strat,from=yango-movies-web,pfx,prpo=900,sfx,ts=6b061600/manifest.mpd?ottsessionid=ad5730f2f580460f9acbb8732c3f0e02&vsid=0513a384e02480e4044408e1807aa4d2ba680fa3a2b0xFLMx6690x1795388159&vpuid=qxeavoja6g&source_index=1&mburl=1&subs=1&deranged=1&force_protection=pr&t=1795388160172#t=0";
    const DEFAULT_KEYS = "05329e8817c48f34ebb24e24dcd10003:cca186285d52f718685d25d4154e672a";

    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const timerBadge = document.getElementById("timerBadge");
    let player = null;
    let clipTimer = null;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function clearTimer() {
      if (clipTimer) {
        clearTimeout(clipTimer);
        clipTimer = null;
      }
      timerBadge.textContent = "وضع البث المفتوح";
    }

    function parseKeys(raw) {
      const map = {};
      for (const pair of (raw || "").split(",")) {
        const [kid, key] = pair.trim().split(":");
        if (kid && key) map[kid.trim()] = key.trim();
      }
      return map;
    }

    async function loadCurrent(limitTwoMinutes) {
      clearTimer();
      const params = new URLSearchParams(location.search);
      const mpd = params.get("mpd") || DEFAULT_MPD;
      const keys = parseKeys(params.get("keys") || DEFAULT_KEYS);

      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        setStatus("المتصفح الحالي لا يدعم Shaka Player.");
        return;
      }

      if (!player) {
        player = new shaka.Player();
        await player.attach(video);
        player.addEventListener("error", (e) => {
          const code = e.detail?.code || "غير معروف";
          setStatus(`تعذر التشغيل في المتصفح (رمز: ${code}). قد يمنع السيرفر تشغيل dash_drm المباشر أو تكون الجلسة منتهية.`);
        });
      }

      player.configure({
        drm: Object.keys(keys).length ? { clearKeys: keys } : {}
      });

      setStatus("جاري تحميل البث...");
      try {
        await player.load(mpd);
        if (limitTwoMinutes) {
          timerBadge.textContent = "بث تجريبي: دقيقتان";
          clipTimer = setTimeout(() => {
            stopStream();
            setStatus("تم إيقاف البث التجريبي بعد دقيقتين.");
          }, 120 * 1000);
        }
        setStatus("تم تحميل البث.");
      } catch (err) {
        setStatus(`فشل تحميل البث (رمز: ${err.code || "غير معروف"}).`);
      }
    }

    async function stopStream() {
      clearTimer();
      if (player) await player.unload().catch(() => {});
      video.pause();
      video.removeAttribute("src");
      video.load();
      setStatus("تم إيقاف البث.");
    }

    document.addEventListener("DOMContentLoaded", () => loadCurrent(false));
  </script>
</body>
</html>
