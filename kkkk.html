<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغّل DASH ClearKey — الجواهرجي</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .container {
      width: 92%;
      max-width: 960px;
    }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <video id="video" controls autoplay></video>
    <div id="status">جاري تحميل البث...</div>
  </div>

  <script>
    const DEFAULT_MPD = "https://playlists.play.yango.tech/vod/vh-ottmn-converted/vod-content/f0b39b5d0dc04f35a2c20112f3eeca00/MWx1795010897x6094062889886833286xdfc07b3d-21e4-3927-befa-3e5311e0c34f/kaltura/dash_drm_sdr_hd_avc_aac_b98956bb4f840f9cfe642fdbdf79d649/x/ysign1=396d4650fb41fd25ddfce805ba257c206bc4d62bd168f53b85c5097065dd4e07,abcID=45119,bstrat=mena_v1_strat,from=yango-movies-web,pfx,prpo=900,sfx,ts=6b05a1ca/manifest.mpd?ottsessionid=5b3f8ab15bfa41a3ae53c4266db491cd&vsid=1036685dc0b2c394001e51f2882473ec946716460b01xFLMx6690x1795358410&vpuid=qxeavoja6g&source_index=1&mburl=1&subs=1&deranged=1&force_protection=pr&t=1795358411443#t=0";
    const DEFAULT_KEYS = "05329e8817c48f34ebb24e24dcd10003:cca186285d52f718685d25d4154e672a";

    const params = new URLSearchParams(location.search);
    const mpd = params.get("mpd") || DEFAULT_MPD;
    const rawKeys = params.get("keys") || DEFAULT_KEYS;

    const clearKeys = {};
    for (const pair of rawKeys.split(",")) {
      const [kid, key] = pair.trim().split(":");
      if (kid && key) {
        clearKeys[kid.trim()] = key.trim();
      }
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    async function init() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        setStatus("المتصفح الحالي لا يدعم Shaka Player.");
        return;
      }

      const video = document.getElementById("video");
      const player = new shaka.Player();
      await player.attach(video);

      if (Object.keys(clearKeys).length > 0) {
        player.configure({
          drm: { clearKeys }
        });
      }

      player.addEventListener("error", (event) => {
        const err = event.detail;
        setStatus(`تعذر التشغيل (رمز الخطأ: ${err.code || "غير معروف"}).`);
      });

      try {
        await player.load(mpd);
        setStatus("تم تحميل البث بنجاح.");
      } catch (err) {
        setStatus(`فشل تحميل البث (رمز الخطأ: ${err.code || "غير معروف"}).`);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
