<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشغّل DASH</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .container {
      width: 92%;
      max-width: 960px;
    }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <video id="video" controls autoplay></video>
    <div id="status">جاري تحميل البث...</div>
  </div>

  <script>
    const DEFAULT_MPD = "https://playlists.play.yango.tech/vod/vh-ottmn-converted/vod-content/d71b3ed9690d4b26aec7d634799ca708/21956721x1794480362xd5764eba-e97f-4c4d-9fc3-827e709869e3/kaltura/dash_clear_sdr_hd_avc_aac_0e0e06da757cff33d29bd2462a5a7612/x/ysign1=022895c08d73c0c185667ac277e01627580c425e7654c4ea719b131a0e1880f5,abcID=45119,bstrat=mena_v1_strat,from=yango-movies-web,pfx,prpo=900,sfx,ts=6b059a2d/manifest.mpd?ottsessionid=9616b0ea68824743889a176073197319&vsid=9a74face70bb1bdc6c34a4b8b48ec90df9dbb555f888xFLMx6690x1795356461&vpuid=qxeavoja6g&source_index=1&mburl=1&subs=1&deranged=1&t=1795356462325&selected_id=vid1";

    const params = new URLSearchParams(location.search);
    const mpd = params.get("mpd") || DEFAULT_MPD;
    const rawKeys = params.get("keys") || "";

    const clearKeys = {};
    for (const pair of rawKeys.split(",")) {
      const [kid, key] = pair.trim().split(":");
      if (kid && key) {
        clearKeys[kid.trim()] = key.trim();
      }
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    async function init() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        setStatus("المتصفح الحالي لا يدعم Shaka Player.");
        return;
      }

      const video = document.getElementById("video");
      const player = new shaka.Player();
      await player.attach(video);

      if (Object.keys(clearKeys).length > 0) {
        player.configure({
          drm: { clearKeys }
        });
      }

      player.addEventListener("error", (event) => {
        const err = event.detail;
        setStatus(`تعذر التشغيل (رمز الخطأ: ${err.code || "غير معروف"}).`);
      });

      try {
        await player.load(mpd);
        setStatus("تم تحميل البث بنجاح.");
      } catch (err) {
        setStatus(`فشل تحميل البث (رمز الخطأ: ${err.code || "غير معروف"}).`);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
