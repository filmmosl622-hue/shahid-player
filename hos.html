<script>
let shakaPlayerInstance = null;

// تحويل Hex (kid:key) إلى Base64Url المطلوب في Shaka clearKeys
function hexToBase64Url(hex) {
    const clean = hex.trim().toLowerCase();
    const bytes = new Uint8Array(clean.length / 2);
    for (let i = 0; i < clean.length; i += 2) {
        bytes[i / 2] = parseInt(clean.substr(i, 2), 16);
    }
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// فصل رابط الـ MPD عن المفاتيح سواء بصيغة &keys= أو ?keys= أو #keys=
function parseStreamLink(rawUrl) {
    const match = rawUrl.match(/^(.*?)[?&#]keys=([^&#]+)/i);
    if (!match) {
        return { mpdUrl: rawUrl.trim(), clearKeys: {} };
    }

    const mpdUrl = match[1].trim();
    const keysPart = decodeURIComponent(match[2].trim());
    const clearKeys = {};

    keysPart.split(',').forEach(pair => {
        const parts = pair.split(':');
        if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
            const kidB64 = hexToBase64Url(parts[0]);
            const keyB64 = hexToBase64Url(parts[1]);
            clearKeys[kidB64] = keyB64;
        }
    });

    return { mpdUrl, clearKeys };
}

async function initShakaIfNeeded() {
    const video = document.getElementById('shaka-video');
    if (!shakaPlayerInstance) {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            throw new Error('المتصفح الحالي لا يدعم Shaka Player');
        }
        shakaPlayerInstance = new shaka.Player(video);
        shakaPlayerInstance.addEventListener('error', (event) => {
            const err = event.detail;
            document.getElementById('shaka-status').textContent =
                'خطأ في التشغيل (كود ' + err.code + ')';
        });
    }
    return shakaPlayerInstance;
}

async function playStream(rawLink, epTitle) {
    const modal = document.getElementById('shaka-modal');
    const video = document.getElementById('shaka-video');
    const titleEl = document.getElementById('shaka-ep-title');
    const statusEl = document.getElementById('shaka-status');

    titleEl.textContent = epTitle || 'تشغيل الحلقة';
    statusEl.textContent = 'جاري تحميل البث...';
    modal.classList.add('active');

    const { mpdUrl, clearKeys } = parseStreamLink(rawLink);

    // لو الرابط ملف MP4 عادي وليس MPD
    if (/\.mp4(\?|$)/i.test(mpdUrl)) {
        if (shakaPlayerInstance) {
            await shakaPlayerInstance.unload();
        }
        video.src = mpdUrl;
        statusEl.textContent = '';
        video.play().catch(() => {});
        return;
    }

    try {
        const player = await initShakaIfNeeded();
        player.configure({
            drm: {
                clearKeys: clearKeys
            },
            streaming: {
                bufferingGoal: 20,
                rebufferingGoal: 5
            }
        });

        await player.load(mpdUrl);
        statusEl.textContent = '';
        video.play().catch(() => {});
    } catch (e) {
        statusEl.textContent = 'تعذر تشغيل الرابط: ' + (e.message || e);
    }
}

async function closeShakaPlayer() {
    const modal = document.getElementById('shaka-modal');
    const video = document.getElementById('shaka-video');
    video.pause();
    video.removeAttribute('src');
    if (shakaPlayerInstance) {
        try {
            await shakaPlayerInstance.unload();
        } catch (e) {}
    }
    modal.classList.remove('active');
}

// ربط النقرات على الحلقات
document.getElementById('page').addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (!link) return;

    const streamUrl = link.getAttribute('data-stream') || link.getAttribute('href') || '';
    const epTitle = (link.querySelector('.episode-title')?.textContent || '').trim();

    // لو لينك MPD أو MP4 نفتح مشغل Shaka
    if (link.hasAttribute('data-stream') || streamUrl.includes('.mpd') || streamUrl.includes('.mp4')) {
        e.preventDefault();
        playStream(streamUrl, epTitle);
    }
    // لو رابط go: نسيبه يتصرف كرابط عادي داخل التطبيق
});
</script>
