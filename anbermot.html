<!-- كود التحديث التلقائي كل 10 ثانية (10000 ميلي ثانية) -->
<script>
let shakaPlayerInstance = null;
let autoReloadTimer = null;

function startAutoReload() {
    clearTimeout(autoReloadTimer);
    autoReloadTimer = setTimeout(function(){
        location.reload();
    }, 10000);
}

function stopAutoReload() {
    clearTimeout(autoReloadTimer);
}

function enterFullscreen() {
    const modal = document.getElementById('shaka-modal');
    if (!document.fullscreenElement && modal.requestFullscreen) {
        modal.requestFullscreen().catch(() => {});
    } else if (!document.webkitFullscreenElement && modal.webkitRequestFullscreen) {
        modal.webkitRequestFullscreen();
    }
}

function exitFullscreenIfAny() {
    if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
    }
}

function hexToBase64Url(hex) {
    const clean = hex.trim().toLowerCase();
    const bytes = new Uint8Array(clean.length / 2);
    for (let i = 0; i < clean.length; i += 2) {
        bytes[i / 2] = parseInt(clean.substr(i, 2), 16);
    }
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function parseStreamLink(rawUrl) {
    const match = rawUrl.match(/^(.*?)[?&#]keys=([^&#]+)/i);
    if (!match) {
        return { mpdUrl: rawUrl.trim(), clearKeys: {} };
    }

    const mpdUrl = match[1].trim();
    const keysPart = decodeURIComponent(match[2].trim());
    const clearKeys = {};

    keysPart.split(',').forEach(pair => {
        const parts = pair.split(':');
        if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
            const kidB64 = hexToBase64Url(parts[0]);
            const keyB64 = hexToBase64Url(parts[1]);
            clearKeys[kidB64] = keyB64;
        }
    });

    return { mpdUrl, clearKeys };
}

async function initShakaIfNeeded() {
    const video = document.getElementById('shaka-video');
    if (!shakaPlayerInstance) {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            throw new Error('المتصفح الحالي لا يدعم Shaka Player');
        }
        shakaPlayerInstance = new shaka.Player(video);
        shakaPlayerInstance.addEventListener('error', (event) => {
            const err = event.detail;
            document.getElementById('shaka-status').textContent =
                'خطأ في التشغيل (كود ' + err.code + ')';
        });
    }
    return shakaPlayerInstance;
}

async function playStream(rawLink, epTitle) {
    stopAutoReload();

    const modal = document.getElementById('shaka-modal');
    const video = document.getElementById('shaka-video');
    const titleEl = document.getElementById('shaka-ep-title');
    const statusEl = document.getElementById('shaka-status');

    titleEl.textContent = epTitle || 'تشغيل الحلقة';
    statusEl.textContent = 'جاري تحميل البث...';
    modal.classList.add('active');
    enterFullscreen();

    const { mpdUrl, clearKeys } = parseStreamLink(rawLink);

    if (/\.mp4(\?|$)/i.test(mpdUrl)) {
        if (shakaPlayerInstance) {
            await shakaPlayerInstance.unload();
        }
        video.src = mpdUrl;
        statusEl.textContent = '';
        video.play().catch(() => {});
        return;
    }

    try {
        const player = await initShakaIfNeeded();
        player.configure({
            drm: {
                clearKeys: clearKeys
            },
            streaming: {
                bufferingGoal: 20,
                rebufferingGoal: 5
            }
        });

        await player.load(mpdUrl);
        statusEl.textContent = '';
        video.play().catch(() => {});
        setTimeout(enterFullscreen, 250);
    } catch (e) {
        statusEl.textContent = 'تعذر تشغيل الرابط: ' + (e.message || e);
    }
}

async function closeShakaPlayer() {
    const modal = document.getElementById('shaka-modal');
    const video = document.getElementById('shaka-video');
    video.pause();
    video.removeAttribute('src');
    if (shakaPlayerInstance) {
        try {
            await shakaPlayerInstance.unload();
        } catch (e) {}
    }
    exitFullscreenIfAny();
    modal.classList.remove('active');
    startAutoReload();
}

document.getElementById('shaka-modal').addEventListener('click', function(e) {
    if (e.target.closest('button')) return;
    enterFullscreen();
});

document.getElementById('page').addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (!link) return;

    const streamUrl = link.getAttribute('data-stream') || link.getAttribute('href') || '';
    const epTitle = (link.querySelector('.episode-title')?.textContent || '').trim();

    if (link.hasAttribute('data-stream') || streamUrl.includes('.mpd') || streamUrl.includes('.mp4')) {
        e.preventDefault();
        playStream(streamUrl, epTitle);
    }
});

// بدء مؤقت التحديث التلقائي عند تحميل الصفحة
startAutoReload();

// منع النوافذ المنبثقة (Popups)
window.open = function() { return null; };

// مراقبة الصفحة وحذف أي إعلانات أو iframes يتم حقنها تلقائياً
(function() {
    const adKeywords = ['ads', 'adserver', 'doubleclick', 'googlesyndication', 'popads', 'adsterra', 'propeller', 'banner'];

    function removeAds(node) {
        if (node.nodeType !== 1) return;
        const tag = node.tagName.toLowerCase();
        const src = (node.getAttribute('src') || '').toLowerCase();
        const id = (node.id || '').toLowerCase();
        const cls = (typeof node.className === 'string' ? node.className : '').toLowerCase();

        // تجاهل عناصر المشغل والصفحة الأساسية
        if (id === 'shaka-modal' || id === 'page' || id === 'shaka-video') return;

        if (tag === 'iframe' || tag === 'ins' || adKeywords.some(k => src.includes(k) || id.includes(k) || cls.includes(k))) {
            node.remove();
        }
    }

    const observer = new MutationObserver(mutations => {
        mutations.forEach(m => {
            m.addedNodes.forEach(node => removeAds(node));
        });
    });

    observer.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
